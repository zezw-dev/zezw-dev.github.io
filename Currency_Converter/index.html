<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول العملات اللحظي | ZEZW</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="converter-card">
        <header>
            <div class="brand-tag">&lt;/&gt; ZEZW</div>
            <h1>💱 محول العملات اللحظي</h1>
            <p>أسعار صرف حية ومحدثة مباشرة من الإنترنت</p>
        </header>

        <div class="input-group">
            <label for="amount">المبلغ المراد تحويله:</label>
            <input type="number" id="amount" value="100" min="0" step="any" placeholder="أدخل المبلغ...">
        </div>

        <div class="currencies-column">
            <div class="select-box">
                <label for="from-currency">من عملة:</label>
                <select id="from-currency">
                    <option value="USD" selected>🇺🇸 دولار أمريكي (USD)</option>
                    <option value="EGP">🇪🇬 جنيه مصري (EGP)</option>
                    <option value="SAR">🇸🇦 ريال سعودي (SAR)</option>
                    <option value="AED">🇦🇪 درهم إماراتي (AED)</option>
                    <option value="EUR">🇪🇺 يورو أوروبي (EUR)</option>
                    <option value="GBP">🇬🇧 جنيه إسترليني (GBP)</option>
                    <option value="KWD">🇰🇼 دينار كويتي (KWD)</option>
                </select>
            </div>

            <button type="button" id="swap-btn" title="تبديل العملات">⇅</button>

            <div class="select-box">
                <label for="to-currency">إلى عملة:</label>
                <select id="to-currency">
                    <option value="EGP" selected>🇪🇬 جنيه مصري (EGP)</option>
                    <option value="USD">🇺🇸 دولار أمريكي (USD)</option>
                    <option value="SAR">🇸🇦 ريال سعودي (SAR)</option>
                    <option value="AED">🇦🇪 درهم إماراتي (AED)</option>
                    <option value="EUR">🇪🇺 يورو أوروبي (EUR)</option>
                    <option value="GBP">🇬🇧 جنيه إسترليني (GBP)</option>
                    <option value="KWD">🇰🇼 دينار كويتي (KWD)</option>
                </select>
            </div>
        </div>

        <div class="result-box">
            <div id="rate-info" class="rate-info">جاري جلب سعر الصرف اللحظي...</div>
            <div id="result-amount" class="result-amount">---</div>
            <div id="last-update" class="last-update"></div>
        </div>

        <button type="button" id="convert-btn" class="convert-btn">تحديث السعر والتحويل الآن</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
