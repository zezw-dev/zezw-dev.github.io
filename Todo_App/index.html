<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مهامي الذكية | ZEZW To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>📝 قائمة مهامي الذكية</h1>
            <p>نظّم يومك وأنجز أهدافك بسهولة</p>
        </header>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة هنا...">
            <button id="addBtn">إضافة</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="pending">قيد التنفيذ</button>
            <button class="filter-btn" data-filter="completed">المكتملة</button>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="app-footer">
            <span id="tasksCount">0 مهام متبقية</span>
            <button id="clearCompleted">مسح المكتملة</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
